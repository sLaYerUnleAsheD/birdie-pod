version: '3.8'

services:
  # 1. Legacy SQL Server Reference Oracle (Port 1433)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Aegis@2024
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Aegis@2024 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Modernize Web Studio (Port 8000)
  web-studio:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: aegis_web_studio
    command: ["python", "serve.py"]
    ports:
      - "8000:8000"
    environment:
      - MSSQL_HOST=sqlserver
      - MSSQL_PORT=1433
      - MSSQL_USER=sa
      - MSSQL_SA_PASSWORD=Aegis@2024
    depends_on:
      - sqlserver

  # 3. Benchmark Runner & PySpark Lakehouse Sandbox
  benchmark-runner:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: aegis_spark_benchmark
    command: ["python", "-m", "dpm.benchmark", "--cost-cap", "2.0"]
    environment:
      - MSSQL_HOST=sqlserver
      - MSSQL_PORT=1433
      - MSSQL_USER=sa
      - MSSQL_SA_PASSWORD=Aegis@2024
      - META_API_KEY=${META_API_KEY:-}
    depends_on:
      - sqlserver
    profiles:
      - benchmark
